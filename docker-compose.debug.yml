# Override for `make infra-debug`: dlv headless in the container, VS Code attaches via "Debug Server (docker)".
services:
  server:
    container_name: omnic-server-debug
    build:
      target: debug
    ports:
      - "127.0.0.1:2345:2345" # dlv, host loopback only
    cap_add: [SYS_PTRACE]
    security_opt: ["seccomp=unconfined"]
